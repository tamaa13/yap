<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <!-- Boxing-reticle pointer for actionable elements. Promoter crimson crosshair
       with a gold center bead. Hotspot at center (14, 14). -->
  <defs>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.8" flood-color="#0E0B08" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#s)" stroke="#F2EDE2" stroke-width="0.6">
    <!-- crosshair lines, crimson -->
    <line x1="14" y1="2"  x2="14" y2="9"  stroke="#C8102E" stroke-width="2.2" stroke-linecap="square"/>
    <line x1="14" y1="19" x2="14" y2="26" stroke="#C8102E" stroke-width="2.2" stroke-linecap="square"/>
    <line x1="2"  y1="14" x2="9"  y2="14" stroke="#C8102E" stroke-width="2.2" stroke-linecap="square"/>
    <line x1="19" y1="14" x2="26" y2="14" stroke="#C8102E" stroke-width="2.2" stroke-linecap="square"/>
    <!-- center bead, gold on crimson rim -->
    <circle cx="14" cy="14" r="2.4" fill="#C9A961" stroke="#7A0918" stroke-width="1"/>
  </g>
</svg>
