name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from package.json's `packageManager` field —
        # specifying both here AND there triggers ERR_PNPM_BAD_PM_VERSION.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Atomic ssh-keyscan with retry — partial output corrupted
          # known_hosts on prior workflow versions, surfacing as
          # "Host key verification failed" on the first ssh call.
          for i in 1 2 3; do
            if ssh-keyscan -p 22987 -H 103.150.227.197 > /tmp/known_hosts.tmp 2>/dev/null \
               && [ -s /tmp/known_hosts.tmp ]; then
              cat /tmp/known_hosts.tmp >> ~/.ssh/known_hosts
              echo "ssh-keyscan succeeded on attempt $i"
              break
            fi
            echo "ssh-keyscan attempt $i failed, retrying in 3s"
            sleep 3
          done
          if ! grep -q "^|" ~/.ssh/known_hosts 2>/dev/null; then
            echo "ssh-keyscan never produced output — aborting"
            exit 1
          fi

      - name: Fetch .env.local from VPS
        run: |
          # Pull build-time env (NEXT_PUBLIC_*) + server-side env from
          # VPS so the runner builds with the same config that pm2 sees.
          # Cleaner than mirroring 25+ vars as GitHub secrets and means
          # config rotates in one place (the VPS file).
          scp -i ~/.ssh/deploy_key -P 22987 \
            -o ServerAliveInterval=30 \
            yap-service@103.150.227.197:~/yap/apps/web/.env.local \
            apps/web/.env.local

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (on runner — VPS RAM is too tight)
        run: |
          # 7GB GHA runner has plenty of headroom; previous "build on
          # VPS" pattern OOM-thrashed the 1.9GB box (load avg 13+,
          # swap 100%) and SSH connections dropped mid-build, leaving
          # pm2 serving stale code for 7+ hours.
          cd apps/web
          rm -rf .next
          pnpm build

      - name: Package build artifact
        run: |
          cd apps/web
          # Just the .next directory — node_modules stays on VPS
          # (lockfile pinning ensures it's already in sync). If a
          # future commit changes the lockfile, the post-deploy
          # pnpm install on VPS picks up the delta.
          tar -czf /tmp/yap-web-build.tar.gz .next public package.json

      - name: Ship + activate on VPS
        run: |
          scp -i ~/.ssh/deploy_key -P 22987 \
            -o ServerAliveInterval=30 \
            /tmp/yap-web-build.tar.gz \
            yap-service@103.150.227.197:/tmp/yap-web-build.tar.gz
          ssh -i ~/.ssh/deploy_key -p 22987 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            yap-service@103.150.227.197 << 'DEPLOY'
            set -e
            cd ~/yap
            # Use fetch + reset --hard instead of pull so the deploy survives
            # history rewrites on origin (e.g. force-push after a commit-msg
            # cleanup). pull would refuse to fast-forward across divergence;
            # reset always lands on whatever main is now.
            git fetch origin main
            git reset --hard origin/main
            cd apps/web

            # Refresh deps only if the lockfile drifted (fast skip on
            # most deploys; a 500MB pnpm install only happens when
            # someone actually added a dep).
            if ! cmp -s pnpm-lock.yaml /tmp/yap-prev-lockfile 2>/dev/null; then
              echo "Lockfile changed — running pnpm install"
              NODE_OPTIONS="--max-old-space-size=1200" pnpm install --frozen-lockfile
              cp pnpm-lock.yaml /tmp/yap-prev-lockfile
            else
              echo "Lockfile unchanged — skipping pnpm install"
            fi

            # Replace built artifact atomically. We tar over .next and
            # public/ — copying live without staging risks pm2 hitting
            # half-extracted chunks during the SIGUSR2 reload.
            rm -rf .next.new
            mkdir .next.new
            tar -xzf /tmp/yap-web-build.tar.gz -C .next.new
            rm -rf .next .next.old.purge 2>/dev/null
            mv .next.new/.next .next
            # public/ is mostly static — only swap if shipped
            if [ -d .next.new/public ]; then
              rm -rf public.new
              mv .next.new/public public.new
              rm -rf public
              mv public.new public
            fi
            rm -rf .next.new
            rm -f /tmp/yap-web-build.tar.gz

            # pm2 reload re-reads ecosystem.config.cjs; --update-env
            # picks up any .env.local changes in the same swap.
            pm2 startOrReload ~/yap/ecosystem.config.cjs --update-env
            pm2 save
            echo "✓ Deploy done at $(date)"
          DEPLOY

      - name: Health check
        run: |
          # pm2 reload returns immediately; Next.js needs ~7-10s to
          # print "Ready". Poll instead of fixed sleep.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://103.150.227.197/ || true)
            if [ "$code" = "200" ]; then
              echo "✓ healthy (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "✗ health check timed out (last code: $code)"
          exit 1
