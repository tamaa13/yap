name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Retry ssh-keyscan — the host occasionally drops SSH probes
          # under load and a 5-second silent failure cancels the deploy.
          for i in 1 2 3; do
            if ssh-keyscan -p 22987 -H 103.150.227.197 >> ~/.ssh/known_hosts 2>&1; then
              break
            fi
            echo "ssh-keyscan attempt $i failed, retrying in 3s"
            sleep 3
          done

      - name: Deploy to VPS
        run: |
          # ServerAliveInterval keeps the control channel hot during the
          # 4-6 minute Turbopack build. Without it, SSH idle-timeouts at
          # ~5 minutes and "client_loop: Broken pipe" kills the deploy.
          ssh -i ~/.ssh/deploy_key -p 22987 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            yap-service@103.150.227.197 << 'DEPLOY'
            set -e
            cd ~/yap
            git pull origin main
            cd apps/web
            NODE_OPTIONS="--max-old-space-size=1536" pnpm install --frozen-lockfile
            # Always purge .next before build. Turbopack's incremental
            # chunk cache occasionally retains references to deleted
            # files (e.g. WelcomeBackBanner ChunkLoadError after
            # a048c5c, RSC manifest stale after motion pilot). Cost of
            # full rebuild is ~10-30s; cost of stale build is a broken
            # demo. Trade is obvious.
            rm -rf .next
            NODE_OPTIONS="--max-old-space-size=1536" pnpm build
            # startOrReload re-reads the ecosystem file every time, so
            # changes like max_memory_restart pick up without a manual
            # delete/start dance. --update-env brings in any new env vars.
            pm2 startOrReload ~/yap/ecosystem.config.cjs --update-env
            pm2 save
            echo "✓ Deploy done at $(date)"
          DEPLOY

      - name: Health check
        run: |
          # Next.js needs ~7-10s to print "Ready" after pm2 reload; poll
          # instead of sleep so we don't race the restart.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://103.150.227.197/ || true)
            if [ "$code" = "200" ]; then
              echo "✓ healthy (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "✗ health check timed out (last code: $code)"
          exit 1
