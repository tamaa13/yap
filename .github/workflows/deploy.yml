name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 103.150.227.197 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key yap-service@103.150.227.197 << 'DEPLOY'
            set -e
            cd ~/yap
            git pull origin main
            cd apps/web
            NODE_OPTIONS="--max-old-space-size=1536" pnpm install --frozen-lockfile
            NODE_OPTIONS="--max-old-space-size=1536" pnpm build
            pm2 reload yap-web || pm2 start ~/yap/ecosystem.config.cjs
            pm2 save
            echo "✓ Deploy done at $(date)"
          DEPLOY

      - name: Health check
        run: |
          sleep 5
          curl -fsS http://103.150.227.197/ -o /dev/null -w "HTTP %{http_code}\n" || exit 1
