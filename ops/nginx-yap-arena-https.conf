# Post-certbot nginx config for yap-arena.xyz
#
# Applied to /etc/nginx/sites-enabled/yap-web on the VPS after certbot
# successfully issues the Let's Encrypt cert. certbot's --nginx mode
# will auto-add the 443 ssl listener + cert paths; this file documents
# the FINAL desired state with security headers + redirect rules so we
# can verify certbot's auto-edit produced something equivalent or
# manually patch if not.

# Port 80: redirect everything to HTTPS (308 permanent)
server {
    listen 80;
    listen [::]:80;
    server_name yap-arena.xyz www.yap-arena.xyz;

    # Let's Encrypt http-01 challenge path — must NOT redirect
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else → 308 to HTTPS
    location / {
        return 308 https://$host$request_uri;
    }
}

# Port 443: actual app with TLS + security headers
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yap-arena.xyz www.yap-arena.xyz;

    # Cert paths (certbot --nginx auto-installs these)
    ssl_certificate     /etc/letsencrypt/live/yap-arena.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yap-arena.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Security headers — production-grade baseline
    # HSTS: 6 months + includeSubDomains (commit after testing — preload
    # opt-in is opt-once + irreversible at the browser-vendor level)
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP intentionally permissive — Next.js + RainbowKit + 0G compute
    # endpoints all need inline scripts / external resources. Tighten
    # post-launch via nonce-based CSP if there's appetite.
    # add_header Content-Security-Policy "default-src 'self'; ..." always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SSE endpoint needs no buffering for real-time push
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        # Same security headers (add_header inheritance doesn't cross
        # location blocks without explicit re-add)
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    }
}
